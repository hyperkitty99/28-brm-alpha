; graphics

anti_aliasing = Anti-Aliasing
shaders = Shaders
gpu_caching = GPU Caching

anti_aliasing_des = If unchecked, disables anti-aliasing, increases performance\nat the cost of sharper visuals.
shaders_des = If unchecked, disables shaders.\nIt's used for some visual effects, and also CPU intensive for weaker PCs.
gpu_caching_des = If checked, allows the GPU to be used for caching textures, decreasing RAM usage.\nDon't turn this on if you have a shitty Graphics Card.

